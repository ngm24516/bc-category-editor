# Temporary: downloads Server Economy and prints how weapons become ATM-sellable. Only reads files. Delete after.
name: Inspect a Workshop mod (temporary)
on:
  push:
    branches: [debug/inspect-server-economy]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.importer -t importer:ci .
      - name: Download and print
        run: |
          mkdir -p out
          opts=""; [ "$(docker version --format '{{.Server.Version}}')" = "29.4.2" ] && opts="--security-opt seccomp=unconfined"
          docker run --name dl $opts --entrypoint bash importer:ci -c '
            for i in 1 2 3; do /opt/steamcmd/steamcmd.sh +force_install_dir /tmp/s +login anonymous +workshop_download_item 108600 3728629828 validate +quit | tail -1
              [ -d /tmp/s/steamapps/workshop/content/108600/3728629828 ] && break; sleep 5; done'
          docker cp dl:/tmp/s/steamapps/workshop/content/108600/3728629828 out/mod
          cd "out/mod/mods/Server Economy/42/media/lua/shared"
          echo "=== GOM FULL ==="; cat HZEconomyGunsOfMarzProducts.lua
          echo "=== getVendingPrice ==="; grep -nA30 'function HZEconomyShared.getVendingPrice' HZEconomyShared.lua
          echo "=== Products: categories and lines with extra fields ==="; grep -nE '^\s{4}[a-z_]+ = \{' HZEconomyProducts.lua; grep -nE 'buybackPercent|minCondition|sellOnly' HZEconomyProducts.lua | head -20
          echo "=== Products: firearms/ammo/magazines/attachments counts ==="; awk '/^    [a-z_]+ = \{/{c=$1} /itemType/{n[c]++} END{for(k in n) print k, n[k]}' HZEconomyProducts.lua
          echo "=== Products: end of file require/apply ==="; grep -nE 'require|apply|return' HZEconomyProducts.lua | tail -10
          echo "=== sandbox: price/sell options ==="; grep -nA8 -E 'option ServerEconomy\.[A-Za-z]*(Percent|Sellback|Buyback)' ../../sandbox-options.txt | grep -E 'option|default' | head -120
