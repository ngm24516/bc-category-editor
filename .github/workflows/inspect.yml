name: inspect
on: { push: { branches: [debug/inspect-money] } }
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.importer -t importer:ci .
      - run: |
          mkdir -p out
          opts=""; [ "$(docker version --format '{{.Server.Version}}')" = "29.4.2" ] && opts="--security-opt seccomp=unconfined"
          docker run --name dl $opts --entrypoint bash importer:ci -c '
            for i in 1 2 3; do /opt/steamcmd/steamcmd.sh +force_install_dir /tmp/s +login anonymous +workshop_download_item 108600 3728629828 validate +quit | tail -1
              [ -d /tmp/s/steamapps/workshop/content/108600/3728629828 ] && break; sleep 5; done'
          docker cp dl:/tmp/s/steamapps/workshop/content/108600/3728629828 out/mod
          cd "out/mod/mods/Server Economy/42/media"
          set +e
          echo "=== contraband shared: price/value/blackmarket lines ==="; grep -nE -i 'price|value|payout|blackmarket|buyback|itemType|fullType' lua/shared/HZContrabandShared.lua | head -400
          echo "=== contraband server: blackMarketView / sell ==="; grep -nE -i 'function [A-Za-z_.:]*(blackMarket|sell|price|payout)' lua/server/HZContrabandServer.lua
          n=$(grep -n 'blackMarketView' lua/server/HZContrabandServer.lua | head -1 | cut -d: -f1); [ -n "$n" ] && sed -n "$n,$((n+120))p" lua/server/HZContrabandServer.lua
          echo "=== getVendingPrice and buy ==="; grep -nA25 'function HZEconomyShared.getVendingPrice' lua/shared/HZEconomyShared.lua
          grep -nE 'getVendingPrice|Stock|stock' lua/server/HZEconomyServer.lua | head -60
          echo "=== Java bridge price functions ==="; grep -rnE 'ServerEconomyJava\.[A-Za-z]*([Pp]rice|[Vv]alue)|bridge\.[A-Za-z]*([Pp]rice|[Vv]alue)' lua | head -40
          echo "=== sandbox EN text: price/stock/blackmarket ==="; grep -nE -i 'price|stock|black ?market|buyback|payout' lua/shared/Translate/EN/Sandbox_EN.txt | head -150
          echo "=== sandbox: black market + contraband options ==="; grep -nA8 -E 'option ServerEconomy(BlackMarket|Contraband)[A-Za-z]*\.' sandbox-options.txt | grep -E 'option|default' | head -120
