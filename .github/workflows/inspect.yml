name: inspect
on: { push: { branches: [debug/inspect-money] } }
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.importer -t importer:ci .
      - run: |
          mkdir -p out
          opts=""; [ "$(docker version --format '{{.Server.Version}}')" = "29.4.2" ] && opts="--security-opt seccomp=unconfined"
          docker run --name dl $opts --entrypoint bash importer:ci -c '
            for i in 1 2 3; do /opt/steamcmd/steamcmd.sh +force_install_dir /tmp/s +login anonymous +workshop_download_item 108600 3728629828 validate +quit | tail -1
              [ -d /tmp/s/steamapps/workshop/content/108600/3728629828 ] && break; sleep 5; done'
          docker cp dl:/tmp/s/steamapps/workshop/content/108600/3728629828 out/mod
          cd "out/mod/mods/Server Economy/42/media"
          set +e
          echo "=== getSandbox ==="; n=$(grep -n 'function HZEconomyShared.getSandbox' lua/shared/HZEconomyShared.lua | head -1 | cut -d: -f1); sed -n "$n,$((n+140))p" lua/shared/HZEconomyShared.lua
          echo "=== product categories ==="; grep -nE '^\s{4}[a-z_]+ = \{' lua/shared/HZEconomyProducts.lua
          echo "=== contraband products and percents ==="; sed -n 40,75p lua/shared/HZContrabandShared.lua; grep -nE 'function C\.(marketPercent|price|premium|quote|dmz)' -A8 lua/shared/HZContrabandShared.lua | head -80
          echo "=== contraband server price ==="; sed -n 50,70p lua/server/HZContrabandServer.lua; sed -n 1150,1185p lua/server/HZContrabandServer.lua | cut -c1-400
          echo "=== java ==="; find /tmp/s ../../.. -iname '*.jar' -o -iname '*.class' 2>/dev/null | head; grep -n 'contrabandPremiumPrice\|contrabandPrice\b' -r lua | head -5
          echo "=== end ==="
          exit 0
