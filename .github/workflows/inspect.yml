name: inspect
on: { push: { branches: [debug/inspect-money] } }
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.importer -t importer:ci .
      - run: |
          mkdir -p out
          opts=""; [ "$(docker version --format '{{.Server.Version}}')" = "29.4.2" ] && opts="--security-opt seccomp=unconfined"
          docker run --name dl $opts --entrypoint bash importer:ci -c '
            for i in 1 2 3; do /opt/steamcmd/steamcmd.sh +force_install_dir /tmp/s +login anonymous +workshop_download_item 108600 3728629828 validate +quit | tail -1
              [ -d /tmp/s/steamapps/workshop/content/108600/3728629828 ] && break; sleep 5; done'
          docker cp dl:/tmp/s/steamapps/workshop/content/108600/3728629828 out/mod
          cd "out/mod/mods/Server Economy/42/media"
          echo "=== files ==="; find . -type f | sort | xargs -d '\n' wc -c | sort -k2 | head -150
          echo "=== blackmarket shared/server/client files (full) ==="
          for f in $(find . -type f -iname '*blackmarket*' | sort); do echo "##### $f"; cat "$f"; done
          echo "=== HZEconomyShared price functions ==="; grep -nE 'function HZEconomyShared\.' lua/shared/HZEconomyShared.lua
          for fn in getVendingPrice getBuyPrice getProductPrice getStockPrice getDynamicPrice getPrice getSellPrice; do grep -nA40 "function HZEconomyShared.$fn\b" lua/shared/HZEconomyShared.lua; done
          echo "=== buy price in server ==="; grep -rnE 'getVendingPrice|getBuyPrice|getProductPrice|priceFor|stockPrice|demand' lua/server lua/shared | grep -v -i blackmarket | head -80
          echo "=== sandbox: all ServerEconomy options with defaults ==="; awk '/^option ServerEconomy\./{o=$2} /default *=/{if(o){print o, $0; o=""}}' sandbox-options.txt
