# Builds the importer image and downloads a real Workshop item (Better Containers) with SteamCMD inside it.
# Runs when the importer changes, or by hand. Separate from CI because it depends on Steam being up.
name: Importer smoke test

on:
  pull_request:
    paths:
      - "importer/**"
      - "Dockerfile.importer"
      - ".github/workflows/importer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: SteamCMD download in the importer image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the importer image
        run: docker build -f Dockerfile.importer -t importer:ci .
      - name: Download Better Containers and read its rule files
        run: |
          engine=$(docker version --format '{{.Server.Version}}')
          echo "Docker Engine $engine"
          if [ "$engine" = "29.4.2" ]; then
            # Docker 29.4.2's default seccomp profile blocks 32-bit network calls, so SteamCMD thinks it's offline.
            # Fixed in 29.4.3. Azure Container Apps doesn't run this Docker release, so only this test needs it.
            echo "::warning::Runner has Docker 29.4.2 (blocks SteamCMD's 32-bit network calls); running with seccomp relaxed"
            docker run --rm --security-opt seccomp=unconfined importer:ci smoke
          else
            docker run --rm importer:ci smoke
          fi
