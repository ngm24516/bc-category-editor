# Builds the importer image and downloads a real Workshop item (Better Containers) with SteamCMD inside it.
# Runs when the importer changes, or by hand. Separate from CI because it depends on Steam being up.
name: Importer smoke test

on:
  pull_request:
    paths:
      - "importer/**"
      - "Dockerfile.importer"
      - ".github/workflows/importer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: SteamCMD download in the importer image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the importer image
        run: docker build -f Dockerfile.importer -t importer:ci .
      - name: Docker version on this runner
        run: docker version --format 'Docker Engine {{.Server.Version}}'
      - name: Download Better Containers and read its rule files
        run: |
          if docker run --rm importer:ci smoke; then exit 0; fi
          echo "::warning::SteamCMD failed under the default seccomp profile; retrying with it relaxed to tell an image problem from a runner one"
          docker run --rm --security-opt seccomp=unconfined importer:ci smoke
          echo "::error::SteamCMD works only with seccomp relaxed: the runner's Docker Engine blocks its 32-bit network calls (Docker 29.4.2 did). The image itself is fine."
          exit 1
